---
# Functionality test: SSO authentication flow should work
# Production-grade test using standardized components

- name: Set test context for SSO
  set_fact:
    test_name: "Functionality: SSO {{ target_service }} redirects correctly"
    test_start_time: "{{ ansible_date_time.epoch }}"

- name: Execute HTTP test for SSO
  include_tasks: common/test_base.yml
  vars:
    test_config:
      url: "https://{{ target_service }}.{{ organization_domain }}"
      headers: {}
      timeout: "{{ test_categories.functionality.timeout }}"
      critical: "{{ test_categories.functionality.critical }}"
      validation_pattern: "{{ test_patterns.sso_redirect.validation_pattern }}"
      expected_statuses: [302]
      validation_logic: "{{
        http_result.status is defined and
        http_result.status == 302 and
        location_valid | default(false)
      }}"
    test_expected: "302 redirect to pangolin.{{ organization_domain }}"
    test_details: "SSO authentication flow validation"

- name: Record SSO functionality result
  include_tasks: common/test_recorder.yml
