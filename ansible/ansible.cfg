[defaults]
inventory = inventory.yml
# inventory = inventory/inventory.ini
host_key_checking = false
callbacks_enabled = debug, timer
stdout_callback = debug
callback_result_format = yaml
# callbacks_enabled = timer
# gathering = explicit
nocows = 1
interpreter_python = auto_silent
# NOTE: jinja2_native is now the default behavior in Ansible Core
# Native types (int, list, dict) are returned automatically - no configuration needed
[ssh_connection]
pipelining = true
