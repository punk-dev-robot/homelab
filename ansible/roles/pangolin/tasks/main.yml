#       🚀 Pangolin Tunnel Infrastructure Management
#       Organization: {{ pangolin_organization_id }}
#       Mode: {{ 'Idempotent' if pangolin_idempotent_mode else 'Force' }}
#       Target Sites: {{ pangolin_target_sites | length }}

- name: Validate required variables
  assert:
    that:
      - pangolin_api_base is defined
      - pangolin_root_key is defined
      - pangolin_target_sites is defined
    fail_msg: "Required Pangolin variables are not properly defined"

# - name: Include organization management tasks
#   include_tasks: organization_management.yml
#   tags: ["pangolin", "organization"]
#
# - name: Include site management tasks
#   include_tasks: site_management.yml
#   tags: ["pangolin", "sites"]
#
- name: Include resource management tasks
  include_tasks: resource_management.yml
  tags: ["pangolin", "resources"]
  when: pangolin_manage_resources | default(true)

- name: Include host configuration tasks
  include_tasks: host_configuration.yml
  tags: ["pangolin", "hosts"]
  when: pangolin_manage_hosts | default(true)

- name: Include auth bypass configuration
  include_tasks: auth_bypass.yml
  tags: ["pangolin", "auth-bypass"]
  when: auth_bypass_enabled | default(true)
