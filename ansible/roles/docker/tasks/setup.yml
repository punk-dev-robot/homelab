- name: Check if docker group exists
  getent:
    database: group
    key: "{{ docker_group }}"
  register: docker_group_exists
  failed_when: false

- name: Create docker group
  group:
    name: "{{ docker_group }}"
    gid: "{{ docker_gid }}"
  when: docker_group_exists.ansible_facts.getent_group is not defined or docker_group_exists.ansible_facts.getent_group[docker_group] is not defined

