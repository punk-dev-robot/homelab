- name: Add my user to docker group
  user:
    name: "{{ docker_my_user }}"
    groups: "{{ docker_group }}"
    append: true

- name: Ensure docker dirs
  become: true
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0775"
  loop:
    - "{{ docker_home_dir }}"
    - "{{ docker_compose_dir }}"
    - "{{ docker_logs_dir }}"
    - "{{ docker_appdata_dir }}"
- name: Install docker
  become: true
  vars:
    docker_users:
      - "{{ docker_my_user }}"
    docker_daemon_options:
      log-driver: "json-file"
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file }}"
  import_role:
    name: geerlingguy.docker
