- name: Tear down existing containers {{ cur_stack }}
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ cur_stack }}"
    state: absent
  failed_when: false
  when: docker_restart

- name: Remove existing compose folder for {{ cur_stack }}
  become: true
  file:
    path: "{{ docker_compose_dir }}/{{ cur_stack }}"
    state: absent

- name: Create compose folder for stack {{ cur_stack }}
  file:
    path: "{{ docker_compose_dir }}/{{ cur_stack }}"
    state: directory
    mode: "0755"

# Homepage widget API keys are read at deploy time from the services' own live
# configs on media-vm — the service config is the single source of truth, keys
# survive rotation, and nothing secret lands in git or 1Password.
# NOTE: the jellyfin 'Homepage' API key is manual state — created once via
# `POST /Auth/Keys?App=Homepage` (KUB-61); a jellyfin rebuild removes it and
# the widget silently degrades until it is recreated.
- name: Collect homepage widget API keys from live service configs (lab)
  become: true
  delegate_to: media-vm
  ansible.builtin.command:
    cmd: python3
    stdin: |
      import json, re, sqlite3
      out = {}
      def xml_key(path):
          m = re.search(r"<ApiKey>([^<]+)</ApiKey>", open(path).read())
          return m.group(1) if m else None
      for svc, path in {
          "SONARR": "/opt/docker/appdata/sonarr/config/config.xml",
          "RADARR": "/opt/docker/appdata/radarr/config/config.xml",
          "LIDARR": "/opt/docker/appdata/lidarr/config.xml",
          "PROWLARR": "/opt/docker/appdata/prowlarr/config.xml",
      }.items():
          try:
              out["HOMEPAGE_VAR_%s_KEY" % svc] = xml_key(path)
          except OSError:
              pass
      try:
          m = re.search(r"apikey:\s*(\S+)",
                        open("/opt/docker/appdata/bazarr/config/config.yaml").read())
          if m:
              out["HOMEPAGE_VAR_BAZARR_KEY"] = m.group(1)
      except OSError:
          pass
      try:
          c = sqlite3.connect("file:/opt/docker/appdata/jellyfin/data/data/jellyfin.db?mode=ro", uri=True)
          r = c.execute("select AccessToken from ApiKeys where Name='Homepage'").fetchone()
          if r:
              out["HOMEPAGE_VAR_JELLYFIN_KEY"] = r[0]
      except sqlite3.Error:
          pass
      print(json.dumps({k: v for k, v in out.items() if v}))
  register: docker_homepage_widget_keys_raw
  changed_when: false
  check_mode: false
  ignore_errors: true # media-vm down must not block the lab deploy — widgets degrade, ${VAR:-} defaults cover it
  no_log: true
  when: cur_stack == 'lab'

- name: Parse homepage widget API keys
  set_fact:
    docker_homepage_widget_env: "{{ docker_homepage_widget_keys_raw.stdout | from_json }}"
  no_log: true
  when:
    - cur_stack == 'lab'
    - docker_homepage_widget_keys_raw.stdout is defined
    - docker_homepage_widget_keys_raw.stdout | length > 0

- name: Generate env file {{ cur_stack }}
  vars:
    stack_env_vars: >-
      {{ docker_env_vars.common | combine(
        docker_env_vars[cur_stack] | default({}),
        env_vars.common | default({}),
        env_vars[cur_stack] | default({}),
        docker_homepage_widget_env | default({}) if cur_stack == 'lab' else {}
      ) }}
  copy:
    content: |
      {% for key, value in stack_env_vars.items() %}
        {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ docker_compose_dir }}/{{ cur_stack }}/.env"
    mode: "0664"

- name: Copy common.yml host file {{ cur_stack }}
  copy:
    src: "common.yml"
    dest: "{{ docker_compose_dir }}"
    mode: "0664"

- name: Copy stack files {{ cur_stack }}
  copy:
    src: "{{ item }}"
    dest: "{{ docker_compose_dir }}"
    mode: "0664"
  with_first_found:
    - "{{ inventory_hostname }}/{{ cur_stack }}"
    - "common/{{ cur_stack }}"

- name: Template Pangolin config file (TEST/DEBUG CODE)
  template:
    src: "{{ playbook_dir }}/files/{{ inventory_hostname }}/{{ cur_stack }}/config/config.yml.j2"
    dest: "{{ docker_compose_dir }}/{{ cur_stack }}/config/config.yml"
    mode: "0664"
  no_log: true
  when: cur_stack == 'pangolin'

- name: Template Traefik dynamic config with admin IPs from 1Password
  template:
    src: "dynamic_config.yml.j2"
    dest: "{{ docker_compose_dir }}/{{ cur_stack }}/traefik_rules/dynamic_config.yml"
    mode: "0664"
  when: cur_stack == 'pangolin'

- name: Template CrowdSec config files with admin IPs from 1Password
  template:
    src: "{{ item.src }}"
    dest: "{{ docker_compose_dir }}/crowdsec/config/crowdsec/{{ item.dest }}"
    mode: "0664"
  loop:
    - src: "config/crowdsec/parsers/s02-enrich/custom-admin-whitelist.yaml.j2"
      dest: "parsers/s02-enrich/custom-admin-whitelist.yaml"
    - src: "config/crowdsec/profiles.yaml.j2"
      dest: "profiles.yaml"
    - src: "config/crowdsec/whitelists.yaml.j2"
      dest: "whitelists.yaml"
  when: cur_stack == 'pangolin'

# custom/whitelist-protection scenario removed (KUB-50 follow-up): type:trigger fired on
# every non-admin event (~56% of console alert quota). IP protection is handled by the
# parser whitelist (custom-admin-whitelist.yaml + whitelists.yaml); scenarios can't whitelist.
- name: Remove broken custom whitelist-protection scenario
  file:
    path: "{{ docker_compose_dir }}/crowdsec/config/crowdsec/scenarios/custom-whitelist-protection.yaml"
    state: absent
  when: cur_stack == 'pangolin'

- name: Ensure services are running ({{ cur_stack }})
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}/{{ cur_stack }}"
  when: docker_restart
