services:
  janitorr:
    container_name: janitorr
    extends:
      file: ../common.yml
      service: base # gives restart policy — was implicit "no", sat Exited after crashes (KUB-51)
    image: ghcr.io/schaka/janitorr:native-v1.9.0
    user: ${PUID}:${PGID} # Replace with your user who should own your application.yml file
    mem_limit: 400M # is used to dynamically calculate heap size, can go as low as 200MB, but 256 is recommended - higher for very large libraries
    mem_swappiness: 0
    volumes:
      - ${APP_DATA}/janitorr/config:/config
      - ${APP_DATA}/janitorr/logs:/logs
      - ${DATA_DIR}/media:/data
    environment:
      # Uses https://github.com/dmikusa/tiny-health-checker supplied by paketo buildpacks
      - THC_PATH=/health
      - THC_PORT=8081
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      start_period: 30s
      interval: 5s
      retries: 3
