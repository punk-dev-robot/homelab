http:
    middlewares:
        authelia:
            forwardAuth:
                address: "http://authelia:9091/api/authz/forward-auth"
                authResponseHeaders:
                    - Remote-User
                    - Remote-Groups
                    - Remote-Name
                    - Remote-Email
                trustForwardHeader: true
        authentik:
            forwardAuth:
                address: "http://authentik:9000/outpost.goauthentik.io/auth/traefik"
                authResponseHeaders:
                    - X-authentik-username
                    - X-authentik-groups
                    - X-authentik-email
                    - X-authentik-name
                    - X-authentik-uid
                trustForwardHeader: true
        basic-auth:
            basicAuth:
                users:
                    - admin:$apr1$H6uskkkW$IgXLP6ewTrSuBkTrqE8wj/
    services:
        failover-demo:
            failover:
                fallback: "backup"
                service: "main"
        simple-lb:
            loadBalancer:
                servers:
                    - url: "http://localhost:8080"
        weighted-demo:
            weighted:
                services:
                    - name: service1
                      weight: 3
                    - name: service2
                      weight: 1
