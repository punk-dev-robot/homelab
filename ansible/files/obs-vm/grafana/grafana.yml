services:
  grafana:
    extends:
      file: ../common.yml
      service: base
    image: grafana/grafana-enterprise:12.3.1
    container_name: grafana
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_METRICS_ENABLED=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - com.centurylinklabs.watchtower.monitor-only

volumes:
  grafana-data:
    name: grafana-data
