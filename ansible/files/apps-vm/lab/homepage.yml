services:
  homepage:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    ports:
      - 3001:3000
    networks:
      - socket_proxy
    volumes:
      - ./homepage-config/:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.lab.nobasura.org,apps.lan:3001

# socket-proxy lives in the oam stack; direct docker.sock mount is unusable because the
# homepage server process is non-root (EACCES on the root:docker socket).
networks:
  socket_proxy:
    name: socket_proxy
    external: true
