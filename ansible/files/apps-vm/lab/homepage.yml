services:
  homepage:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    ports:
      - 3001:3000
    volumes:
      - ./homepage-config/:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro # Keep direct socket access for now
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.lab.nobasura.org,apps.lan:3001
