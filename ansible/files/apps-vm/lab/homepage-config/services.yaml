        container: open_webui
    - Karakeep:
        icon: karakeep.png
        href: https://karakeep.lab.nobasura.org/
        description: Bookmarks / read-later (SSO)
        siteMonitor: http://apps.lan:3004/
        server: apps-docker
        container: karakeep
    - Atuin:
        icon: atuin.png
        href: https://atuin.lab.nobasura.org/
        description: Shell history sync
        siteMonitor: http://apps.lan:12321/
        server: apps-docker
        container: atuin
    - Enclosed:
        icon: mdi-lock-outline
        href: https://enclosed.lab.nobasura.org/
        description: Encrypted note sharing
        siteMonitor: http://apps.lan:8787/
        server: apps-docker
        container: enclosed
    - Firecrawl:
        icon: mdi-fire
        href: https://firecrawl.lab.nobasura.org/
        description: Scrape / crawl API
        siteMonitor: http://apps.lan:3002/
        server: apps-docker
        container: firecrawl_api
    - IT Tools:
        icon: it-tools.png
        href: https://it-tools.lab.nobasura.org/
        description: Dev/ops utility belt
        siteMonitor: http://apps.lan:8080/
