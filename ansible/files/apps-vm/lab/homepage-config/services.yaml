---
# https://gethomepage.dev/configs/services/
#
# Monitoring rules for this estate (verified from inside the homepage container):
#   * .lab.nobasura.org certs are trusted    -> siteMonitor OK
#   * plain http on <vm>.lan:<port> works    -> preferred siteMonitor (bypasses Caddy)
#   * Proxmox/PBS/TrueNAS/OPNsense use self-signed certs and VLAN 101 TCP is
#     firewalled off from the LAB VLAN      -> ICMP `ping` instead of siteMonitor
#   * docker status only for apps-vm (local socket); media/obs need remote docker (pass 2)

- Infra:
    - px-cpu:
        icon: proxmox.png
        href: https://10.10.101.11:8006/
        description: Proxmox node — opnsense2, docker-obs, docker-apps
        ping: 10.10.101.11
    - px-net:
        icon: proxmox.png
        href: https://10.10.101.12:8006/
        description: Proxmox node — opnsense (primary)
        ping: 10.10.101.12
    - px-nas:
        icon: proxmox.png
        href: https://10.10.101.13:8006/
        description: Proxmox node — truenas-scale, docker-media
        ping: 10.10.101.13
    - PBS:
        icon: proxmox-backup-server.png
        href: https://10.10.10.34:8007/
        description: Backup server on zima (kbs)
        ping: 10.10.10.34
    - TrueNAS:
        icon: truenas-scale.png
        href: https://10.10.10.31/
        description: NAS — /mnt/hddpool/data over NFS
        ping: 10.10.10.31
    - OPNsense 1:
        icon: opnsense.png
        href: https://10.10.101.2/
        description: Primary firewall (CARP master) on px-net
        ping: 10.10.101.2
    - OPNsense 2:
        icon: opnsense.png
        href: https://10.10.101.3/
        description: Secondary firewall (CARP backup) on px-cpu
        ping: 10.10.101.3
    - Gateway VPS:
        icon: oracle.png
        href: https://pangolin.nobasura.org/
        description: Public ingress — Traefik + Pangolin + CrowdSec
        siteMonitor: https://pangolin.nobasura.org/

- Apps VM:
    - LiteLLM:
        icon: litellm.png
        href: https://litellm.lab.nobasura.org/
        description: LLM proxy / gateway
        siteMonitor: http://apps.lan:4000/health/liveliness
        server: apps-docker
        container: litellm
    - Open WebUI:
        icon: open-webui.png
        href: https://openwebui.lab.nobasura.org/
        description: Chat UI over LiteLLM
        siteMonitor: http://apps.lan:3000/
