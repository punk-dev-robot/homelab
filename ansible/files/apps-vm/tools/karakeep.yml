services:
  karakeep:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-0.30.0}
    container_name: karakeep
    ports:
      - "3004:3000"
    environment:
      DISABLE_PASSWORD_AUTH: true
      DISABLE_SIGNUPS: false
      LOG_LEVEL: debug
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_URL_INTERNAL: http://karakeep:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      INFERENCE_TEXT_MODEL: ${INFERENCE_TEXT_MODEL}
      INFERENCE_IMAGE_MODEL: ${INFERENCE_IMAGE_MODEL}
      DATA_DIR: /data
      # SSO Configuration
      OAUTH_WELLKNOWN_URL: ${OAUTH_WELLKNOWN_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SCOPE: ${OAUTH_SCOPE:-openid email profile}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-Authentik}
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: ${OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING:-}
      OAUTH_TIMEOUT: ${OAUTH_TIMEOUT:-3500}
    volumes:
      - karakeep_data:/data
    depends_on:
      - karakeep-chrome
      - karakeep-meilisearch
    labels:
      - "deunhealth.restart.on.unhealthy=true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  karakeep-chrome:
    extends:
      file: ../common.yml
      service: base
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: karakeep-chrome
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    labels:
      - "deunhealth.restart.on.unhealthy=true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:9222/json/version",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  karakeep-meilisearch:
    extends:
      file: ../common.yml
      service: base
    image: getmeili/meilisearch:v1.13.3
    container_name: karakeep-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - karakeep_meilisearch:/meili_data
    labels:
      - "deunhealth.restart.on.unhealthy=true"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:7700/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  karakeep_data:
    name: karakeep_data
    driver: local
  karakeep_meilisearch:
    name: karakeep_meilisearch
    driver: local
