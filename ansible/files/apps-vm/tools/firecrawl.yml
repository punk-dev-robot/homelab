x-common-env: &common-env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
  BULL_AUTH_KEY: CHANGEME
  NUM_WORKERS_PER_QUEUE: 8
  CRAWL_CONCURRENT_REQUESTS: 10
  MAX_CONCURRENT_JOBS: 10
  BROWSER_POOL_SIZE: 5
  POSTGRES_USER: firecrawl
  POSTGRES_PASSWORD: firecrawl
  POSTGRES_DB: firecrawl
  POSTGRES_HOST: nuq-postgres
  POSTGRES_PORT: "5432"

services:
  api:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl_api
    command: ["node", "dist/src/harness.js", "--start-docker"]
    ports:
      - "3002:3002"
    environment:
      <<: *common-env
      USE_DB_AUTHENTICATION: false
      PORT: 3002
      HOST: "0.0.0.0"
      NUQ_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LOGGING_LEVEL: DEBUG
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    networks:
      - firecrawl_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "deunhealth.restart.on.unhealthy=true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3002/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  playwright-service:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl_playwright
    environment:
      PORT: 3000
      BLOCK_MEDIA: true
      MAX_CONCURRENT_PAGES: 10
    tmpfs:
      - /tmp
      - /ms-playwright
    networks:
      - firecrawl_backend

  rabbitmq:
    extends:
      file: ../common.yml
      service: base
    image: rabbitmq:3-management
    container_name: firecrawl_rabbitmq
    networks:
      - firecrawl_backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nuq-postgres:
    extends:
      file: ../common.yml
      service: base
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl_nuq_postgres
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl
      POSTGRES_DB: firecrawl
    volumes:
      - firecrawl_postgres_data:/var/lib/postgresql/data
    networks:
      - firecrawl_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl -d firecrawl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    extends:
      file: ../common.yml
      service: base
    image: redis:alpine
    container_name: firecrawl_redis
    command: redis-server --bind 0.0.0.0
    networks:
      - firecrawl_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  firecrawl_backend:
    driver: bridge

volumes:
  firecrawl_data:
    name: firecrawl_data
    driver: local
  firecrawl_postgres_data:
    name: firecrawl_postgres_data
    driver: local
